apiVersion: v1
kind: Namespace
metadata:
  name: tap-webhook
  labels: {tap-admission-test: "true"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admission-code
  namespace: tap-acceptance
data:
  webhook.py: |
    import base64, json, ssl
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            request = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
            patch = [{"op": "add", "path": "/metadata/annotations", "value": {"tap.example/visited": "true"}}]
            response = {"apiVersion": "admission.k8s.io/v1", "kind": "AdmissionReview",
                        "response": {"uid": request["request"]["uid"], "allowed": True,
                                     "patchType": "JSONPatch", "patch": base64.b64encode(json.dumps(patch).encode()).decode()}}
            data = json.dumps(response).encode()
            print("admitted", request["request"]["name"], "from", self.client_address[0], flush=True)
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)
        def log_message(self, *args): pass
    server = HTTPServer(("0.0.0.0", 8443), Handler)
    context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    context.load_cert_chain("/tls/tls.crt", "/tls/tls.key")
    server.socket = context.wrap_socket(server.socket, server_side=True)
    server.serve_forever()
---
apiVersion: v1
kind: Pod
metadata:
  name: admission-controller
  namespace: tap-acceptance
  labels: {app: tap-admission, placement: controller}
spec:
  nodeSelector: {kubernetes.io/hostname: controller}
  containers:
  - name: webhook
    image: python:3.9-slim
    command: ["python3", "-u", "/srv/webhook.py"]
    readinessProbe:
      tcpSocket: {port: 8443}
      periodSeconds: 2
    ports: [{containerPort: 8443}]
    volumeMounts:
    - {name: code, mountPath: /srv}
    - {name: tls, mountPath: /tls, readOnly: true}
  volumes:
  - name: code
    configMap: {name: admission-code}
  - name: tls
    secret: {secretName: admission-tls}
---
apiVersion: v1
kind: Pod
metadata:
  name: admission-node
  namespace: tap-acceptance
  labels: {app: tap-admission, placement: node}
spec:
  nodeSelector: {kubernetes.io/hostname: node}
  containers:
  - name: webhook
    image: python:3.9-slim
    command: ["python3", "-u", "/srv/webhook.py"]
    readinessProbe:
      tcpSocket: {port: 8443}
      periodSeconds: 2
    ports: [{containerPort: 8443}]
    volumeMounts:
    - {name: code, mountPath: /srv}
    - {name: tls, mountPath: /tls, readOnly: true}
  volumes:
  - name: code
    configMap: {name: admission-code}
  - name: tls
    secret: {secretName: admission-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: admission
  namespace: tap-acceptance
spec:
  selector: {app: tap-admission, placement: controller}
  ports: [{port: 443, targetPort: 8443}]
