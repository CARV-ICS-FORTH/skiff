apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: dask-matrix
    dask-matrix/run-id: __RUN_ID__
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dask-matrix
        dask-matrix/run-id: __RUN_ID__
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: __IMAGE_NAME__
          imagePullPolicy: Never
          command: [python, /opt/dask-matrix/benchmark.py]
          env:
            - {name: DASK_SCHEDULER_ADDRESS, value: __SCHEDULER_ADDRESS__}
            - {name: RESULT_DIR, value: __RESULT_DIR__}
            - {name: EXPECTED_WORKERS, value: __EXPECTED_WORKERS__}
            - {name: EXPECTED_SOURCE_SHA256, value: __EXPECTED_SOURCE_SHA256__}
            - {name: MATRIX_SIZE, value: __MATRIX_SIZE__}
            - {name: CHUNK_SIZE, value: __CHUNK_SIZE__}
            - {name: ITERATIONS, value: __ITERATIONS__}
            - {name: WORKER_THREADS, value: __WORKER_THREADS__}
            - {name: BLAS_THREADS, value: __BLAS_THREADS__}
            - {name: RANDOM_SEED_A, value: __RANDOM_SEED_A__}
            - {name: RANDOM_SEED_B, value: __RANDOM_SEED_B__}
            - {name: REQUIRE_ALL_WORKERS, value: __REQUIRE_ALL_WORKERS__}
            - {name: REQUIRE_DISTINCT_NODES, value: __REQUIRE_DISTINCT_NODES__}
            - {name: STARTUP_TIMEOUT_SECONDS, value: __STARTUP_TIMEOUT_SECONDS__}
            - {name: CPU_SAMPLE_INTERVAL_SECONDS, value: __CPU_SAMPLE_INTERVAL_SECONDS__}
          resources:
            requests:
              cpu: __CLIENT_CPU__
              memory: __CLIENT_MEMORY__
            limits:
              cpu: __CLIENT_CPU__
              memory: __CLIENT_MEMORY__
          volumeMounts:
            - name: results
              mountPath: /report
      volumes:
        - name: results
          hostPath:
            path: __RESULTS_POD_HOST_PATH__
            type: DirectoryOrCreate
