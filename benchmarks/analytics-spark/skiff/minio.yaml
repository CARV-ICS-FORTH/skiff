apiVersion: apps/v1
kind: Deployment
metadata:
  name: __MINIO_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: spark-knot-object-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-knot-object-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-knot-object-store
        spark-knot/role: object-store
    spec:
      securityContext:
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        runAsNonRoot: true
      containers:
        - name: minio
          image: __SPARK_IMAGE__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export MC_CONFIG_DIR=/tmp/mc
              /usr/local/bin/minio server /data --address :9000 --console-address :9001 &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' TERM INT EXIT
              until /usr/local/bin/mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                  kill -0 "$server_pid"
                  sleep 1
              done
              /usr/local/bin/mc mb --ignore-existing "local/$MINIO_BUCKET"
              wait "$server_pid"
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: __MINIO_SECRET__
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __MINIO_SECRET__
                  key: root-password
            - name: MINIO_BUCKET
              value: __MINIO_BUCKET__
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            exec:
              command: ["/usr/local/bin/mc", "ready", "local"]
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: __MINIO_CPU_REQUEST__
              memory: __MINIO_MEMORY_REQUEST__
            limits:
              cpu: __MINIO_CPU_LIMIT__
              memory: __MINIO_MEMORY_LIMIT__
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: __MINIO_NAME__
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: spark-knot-object-store
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
