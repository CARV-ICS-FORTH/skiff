apiVersion: v1
kind: ServiceAccount
metadata:
  name: bert-notebook
  namespace: __BERT_NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bert-notebook
  namespace: __BERT_NAMESPACE__
rules:
  - apiGroups: [kubeflow.org]
    resources: [pytorchjobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bert-notebook
  namespace: __BERT_NAMESPACE__
subjects:
  - kind: ServiceAccount
    name: bert-notebook
    namespace: __BERT_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bert-notebook
