name: CI

on:
  push:
    branches: [ main, master, develop, plaid, plaid-dev, 'release/**' ]
  pull_request:
    branches: [ main, master, develop, plaid, plaid-dev, 'release/**' ]

jobs:
  ci:
    name: Build, Fmt, Vet, Test & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: |
            skifflet/go.sum
            plaid/go.sum

      - name: Check gofmt
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          make check-shell

      - name: Run tests
        run: make test

      - name: Run tests with race detector
        run: make test-race

      - name: Build binaries (linux/amd64)
        run: make binaries-linux-amd64

      - name: Build binaries (linux/arm64)
        run: make binaries-linux-arm64
