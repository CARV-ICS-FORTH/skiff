name: CI

on:
  push:
    branches: [ main, master, develop, plaid, plaid-dev, 'release/**' ]
  pull_request:
    branches: [ main, master, develop, plaid, plaid-dev, 'release/**' ]
  # The release workflow runs these checks first.
  workflow_call:

jobs:
  ci:
    name: Build, Fmt, Vet, Test & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            skifflet/go.sum
            plaid/go.sum

      - name: Check gofmt
        run: make fmt-check

      # plaidd's InfiniBand transport (plaid/pkg/rdma) is built with cgo against rdma-core's
      # libibverbs, as in the builder image; without its headers go vet and the tests stop.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck libibverbs-dev

      - name: Run go vet
        run: make vet

      - name: Run ShellCheck
        run: make check-shell

      - name: Run tests
        run: make test

      - name: Run tests with race detector
        run: make test-race

      - name: Cross-compile check (linux/amd64, linux/arm64)
        run: |
          for arch in amd64 arm64; do
            for module in skifflet plaid; do
              (cd "$module" && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build ./...)
            done
          done
